services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formflow-backend
    restart: unless-stopped
    volumes:
      - formflow_data:/app/data
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - formflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - formflow-network

volumes:
  formflow_data:

networks:
  formflow-network:
    driver: bridge
