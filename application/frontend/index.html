<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormFlow - Submit</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="/" class="logo">FormFlow Version 1</a>
      <a href="/submissions" class="nav-link">View Submissions &rarr;</a>
    </header>

    <main class="card">
      <h1 class="card-title">Send a Message</h1>
      <p class="card-subtitle">Fill in the fields below. Submissions are saved directly to the database.</p>

      <div id="alert" class="alert"></div>

      <form id="submissionForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. Alex Johnson">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="alex@example.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn">Send Submission</button>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('submissionForm');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      const data = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value
      };

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = `<strong>Success!</strong> Your message was saved. <a href="/submissions" style="color: inherit; text-decoration: underline; margin-left: 8px;">View all submissions</a>`;
          alertBox.style.display = 'block';
          form.reset();
        } else {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = result.error || 'Failed to submit form.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Submission';
      }
    });
  </script>
</body>

</html>
