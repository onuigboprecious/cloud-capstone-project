name: Deploy FormFlow

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing version tag (e.g. v1.0.0) or commit SHA to redeploy (leave empty to build current commit)'
        required: false
        default: ''

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    # Skip on rollback so an old SHA is never rebuilt from new code
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./application/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/formflow-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/formflow-backend:${{ github.sha }}
          build-args: GIT_SHA=${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./application/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/formflow-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/formflow-frontend:${{ github.sha }}
          build-args: GIT_SHA=${{ env.IMAGE_TAG }}

  deploy:
    needs: publish
    # Run after a successful publish, or when publish was skipped (rollback)
    if: always() && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy compose file and write env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh ubuntu@"$HOST" "mkdir -p ~/formflow"
          scp application/docker-compose.yml ubuntu@"$HOST":~/formflow/
          # Writes the complete .env, so DB_PASSWORD and DOCKERHUB_USERNAME are never lost
          printf 'IMAGE_TAG=%s\nDB_PASSWORD=%s\nDOCKERHUB_USERNAME=%s\n' "$IMAGE_TAG" "$DB_PASSWORD" "$DOCKERHUB_USERNAME" \
            | ssh ubuntu@"$HOST" "cat > ~/formflow/.env"

      - name: Pull and start containers
        run: |
          ssh ubuntu@"$HOST" "cd ~/formflow && docker compose pull && docker compose up -d --remove-orphans"

      - name: Verify running version
        run: |
          for i in $(seq 1 12); do
            actual=$(curl -fsS http://"$HOST"/version | jq -r .version 2>/dev/null || true)
            if [ "$actual" = "$IMAGE_TAG" ]; then
              echo "verified running version: $actual"
              exit 0
            fi
            echo "Attempt $i: found '$actual', expected '$IMAGE_TAG'. Waiting..."
            sleep 5
          done
          echo "Version mismatch after retries"
          exit 1